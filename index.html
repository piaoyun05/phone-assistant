<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手机记录助手</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>📝 记录助手</h1>
            <div class="tab-buttons">
                <button class="tab-btn active" data-tab="record">记录</button>
                <button class="tab-btn" data-tab="schedule">日程</button>
                <button class="tab-btn" data-tab="qa">问答</button>
                <button class="tab-btn" data-tab="settings">设置</button>
            </div>
        </header>

        <main class="app-content">
            <!-- 记录页面 -->
            <div id="record-tab" class="tab-content active">
                <div class="input-section">
                    <textarea id="record-input" placeholder="输入你要记录的内容...&#10;例如：明天下午3点开会&#10;下周一上午10点面试"></textarea>
                    <button id="save-btn" class="primary-btn">保存记录</button>
                </div>
                <div class="records-list">
                    <h3>最近记录</h3>
                    <div id="records-container"></div>
                </div>
            </div>

            <!-- 日程页面 -->
            <div id="schedule-tab" class="tab-content">
                <div class="schedule-header">
                    <h3>我的日程</h3>
                    <div>
                        <button id="sync-schedule-btn" class="icon-btn" title="从记录同步">🔗</button>
                        <button id="refresh-schedule-btn" class="icon-btn" title="刷新">🔄</button>
                    </div>
                </div>
                <div class="schedule-filters">
                    <button class="filter-btn active" data-filter="all">全部</button>
                    <button class="filter-btn" data-filter="today">今天</button>
                    <button class="filter-btn" data-filter="week">本周</button>
                    <button class="filter-btn" data-filter="upcoming">未来</button>
                </div>
                <div id="schedule-container"></div>
            </div>

            <!-- 问答页面 -->
            <div id="qa-tab" class="tab-content">
                <div class="qa-section">
                    <div id="qa-history"></div>
                    <div class="qa-input-section">
                        <input type="text" id="qa-input" placeholder="提问关于你的日程...&#10;例如：明天有什么安排？">
                        <button id="ask-btn" class="primary-btn">提问</button>
                    </div>
                </div>
            </div>

            <!-- 设置页面 -->
            <div id="settings-tab" class="tab-content">
                <div class="settings-section">
                    <h3>AI 设置</h3>
                    <div class="setting-item">
                        <label>API 端点</label>
                        <input type="text" id="api-endpoint" placeholder="https://api.openai.com/v1/chat/completions">
                    </div>
                    <div class="setting-item">
                        <label>API Key</label>
                        <input type="password" id="api-key" placeholder="sk-...">
                    </div>
                    <div class="setting-item">
                        <label>模型名称</label>
                        <input type="text" id="model-name" placeholder="gpt-3.5-turbo">
                    </div>
                    <div class="setting-item">
                        <label style="display:flex;align-items:center;gap:8px;">
                            <input type="checkbox" id="use-proxy" style="width:auto;">
                            使用代理模式（解决 CORS 跨域问题）
                        </label>
                    </div>
                    <button id="save-settings-btn" class="primary-btn">保存设置</button>
                    <button id="test-ai-btn" class="primary-btn" style="margin-top:10px;background:#28a745;">测试 AI 连接</button>
                    <div class="setting-tip">
                        <p><strong>使用方法：</strong></p>
                        <p>1. 直接调用：部分 API（如某些国内模型）支持浏览器直接调用，无需代理</p>
                        <p>2. 代理模式：如果直接调用失败（CORS 错误），需要部署后端代理服务器（server.js），然后勾选"使用代理模式"</p>
                        <p>3. 支持 OpenAI、DeepSeek、智谱等兼容 OpenAI API 的大模型</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
